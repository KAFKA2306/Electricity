name: EIA electricity source

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_eia_electricity.py
      - scripts/build_electricity_metrics.py
      - .github/workflows/eia-electricity-source.yml

permissions:
  actions: write
  contents: write

concurrency:
  group: eia-electricity-source
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install openpyxl==3.1.5
      - name: Refresh official electricity evidence
        run: python scripts/update_eia_electricity.py
      - name: Refresh compact decision metrics
        run: python scripts/build_electricity_metrics.py
      - name: Validate published views
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('api/v1/electricity')
          index = json.loads((root/'index.json').read_text())
          required = {'demand', 'generation', 'interchange', 'generation-mix', 'capacity', 'capacity-additions'}
          assert required <= set(index['datasets'])
          for name in ('demand', 'generation', 'interchange'):
              view = json.loads((root/f'{name}.json').read_text())
              assert view['period_count'] >= 90
              assert view['kind'] == 'actual'
              assert view['unit'] == 'megawatthours'
              assert view['geography']['id'] == 'US48'
              assert len(view['weekly']) >= 13
          mix = json.loads((root/'generation-mix.json').read_text())
          assert mix['fuel_count'] >= 5
          capacity = json.loads((root/'capacity.json').read_text())
          additions = json.loads((root/'capacity-additions.json').read_text())
          assert capacity['operating']['generator_count'] > 0
          assert additions['planned']['generator_count'] > 0
          assert additions['retired']['generator_count'] > 0
          metrics = json.loads((root/'metrics.json').read_text())
          by_metric = {item['metric']: item for item in metrics['observations']}
          assert by_metric['electricity_demand']['as_of'] == json.loads((root/'demand.json').read_text())['last_period']
          assert by_metric['net_generation']['as_of'] == json.loads((root/'generation.json').read_text())['last_period']
          theme = json.loads(Path('api/v1/energy-supply.json').read_text())
          assert set(theme['domains']) == {'petroleum', 'electricity'}
          assert theme['domains']['petroleum']['namespace'] != theme['domains']['electricity']['namespace']
          PY
      - name: Commit changed evidence
        id: commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/electricity/official api/v1/electricity api/v1/energy-supply.json
          if git diff --cached --quiet; then
            echo 'No electricity evidence change.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: update EIA electricity evidence'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Publish automated data commit
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
