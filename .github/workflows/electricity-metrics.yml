name: Electricity decision metrics

on:
  pull_request:
    paths:
      - api/v1/electricity/capacity.json
      - api/v1/electricity/demand.json
      - api/v1/electricity/generation.json
      - api/v1/electricity/metrics.json
      - scripts/build_electricity_metrics.py
      - .github/workflows/electricity-metrics.yml
  push:
    branches: [main]
    paths:
      - api/v1/electricity/capacity.json
      - api/v1/electricity/demand.json
      - api/v1/electricity/generation.json
      - scripts/build_electricity_metrics.py
      - .github/workflows/electricity-metrics.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build deterministic compact view
        run: python scripts/build_electricity_metrics.py --output /tmp/metrics.json
      - name: Verify committed view on pull requests
        if: github.event_name == 'pull_request'
        run: diff -u api/v1/electricity/metrics.json /tmp/metrics.json
      - name: Update compact view on main
        if: github.event_name != 'pull_request'
        run: |
          cp /tmp/metrics.json api/v1/electricity/metrics.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/v1/electricity/metrics.json
          if git diff --cached --quiet; then
            echo 'No electricity metric change.'
            exit 0
          fi
          git commit -m 'data: update electricity decision metrics'
          git push
