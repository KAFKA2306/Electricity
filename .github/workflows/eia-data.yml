name: EIA data integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eia-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/build_eia_api.py scripts/build_electricity_metrics.py scripts/build_weekly_brief.py scripts/update_eia_electricity.py tests/test_eia_api.py tests/test_weekly_brief.py tests/test_eia_electricity_views.py
      - name: Unit tests
        run: python -m unittest tests.test_eia_api tests.test_weekly_brief tests.test_eia_electricity_views -v
      - name: Verify electricity decision metrics
        run: |
          python scripts/build_electricity_metrics.py --output /tmp/electricity-metrics.json
          diff -u api/v1/electricity/metrics.json /tmp/electricity-metrics.json
      - name: Build distribution
        run: python scripts/build_eia_api.py --output build/api/v1
      - name: Smoke test distribution
        run: |
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          root = Path('build/api/v1')
          manifest = json.loads((root/'manifest.json').read_text())
          latest = json.loads((root/'latest.json').read_text())
          series = json.loads((root/'series.json').read_text())
          rows = list(csv.DictReader((root/'observations.csv').open()))
          assert manifest['series_count'] == len(series['series']) == len(latest['series']) == 11
          assert manifest['observation_count'] == len(rows) == 99
          for name, meta in manifest['files'].items():
              data = (root/name).read_bytes()
              assert len(data) == meta['bytes']
              assert hashlib.sha256(data).hexdigest() == meta['sha256']
          PY
      - name: Build weekly petroleum brief sample
        run: python scripts/build_weekly_brief.py --snapshot "$GITHUB_WORKSPACE/data/official/eia-weekly-stocks-2026-08-16.json" --output build/weekly-brief
      - name: Audit weekly brief sample
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/weekly-brief')
          brief = json.loads((root/'brief.json').read_text())
          assert len(brief['series']) == 7
          assert brief['latest_period'] == '2026-08-07'
          assert brief['release_date'] == '2026-08-12'
          assert brief['source_publisher'] == 'U.S. Energy Information Administration (EIA)'
          assert len(brief['source_snapshot_sha256']) == 64
          assert (root/'brief.md').stat().st_size > 0
          assert (root/'brief.html').stat().st_size > 0
          assert all(item['source_url'].startswith('https://www.eia.gov/') for item in brief['series'])
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: eia-petroleum-api-v1
          path: build/api/v1
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-petroleum-brief-sample
          path: build/weekly-brief
          retention-days: 30
      - name: Verify clean checkout
        run: |
          rm -rf build __pycache__ scripts/__pycache__ tests/__pycache__
          test -z "$(git status --porcelain --untracked-files=all)"

  electricity-live:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install XLSX reader
        run: python -m pip install openpyxl==3.1.5
      - name: Collect official electricity evidence
        run: python scripts/update_eia_electricity.py --evidence-dir build/electricity/evidence --api-dir build/electricity/api
      - name: Audit live outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/electricity/api')
          index = json.loads((root/'index.json').read_text())
          required = {'demand', 'generation', 'interchange', 'generation-mix', 'capacity', 'capacity-additions'}
          assert required <= set(index['datasets'])
          for name in ('demand', 'generation', 'interchange'):
              view = json.loads((root/f'{name}.json').read_text())
              assert view['period_count'] >= 90
              assert view['kind'] == 'actual'
              assert view['unit'] == 'megawatthours'
              assert view['day_boundary'] == 'UTC'
              assert view['geography']['id'] == 'US48'
              assert len(view['daily']) >= 90
              assert len(view['weekly']) >= 13
          mix = json.loads((root/'generation-mix.json').read_text())
          assert mix['fuel_count'] >= 5
          assert mix['latest']['by_fuel_mwh']
          capacity = json.loads((root/'capacity.json').read_text())
          assert capacity['operating']['generator_count'] > 0
          additions = json.loads((root/'capacity-additions.json').read_text())
          assert additions['planned']['generator_count'] > 0
          assert additions['retired']['generator_count'] > 0
          theme = json.loads((root.parent/'energy-supply.json').read_text())
          assert set(theme['domains']) == {'petroleum', 'electricity'}
          assert theme['domains']['petroleum']['namespace'] != theme['domains']['electricity']['namespace']
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: eia-electricity-live
          path: build/electricity
          retention-days: 30
